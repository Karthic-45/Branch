[project]
name = "branchable-memory"
version = "0.1.0"
description = "Version control for what an agent believes: branchable, revertible agent memory on CockroachDB"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "anthropic[bedrock]>=0.70",
    "boto3>=1.35",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "mcp>=2.0",
    "reportlab>=4.2",
    "openai>=1.50",
]

[project.scripts]
bmem = "bmem.cli:main"
bmem-audit = "bmem.mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bmem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cluster: requires a live CockroachDB cluster (skipped without BMEM_DATABASE_URL)",
    "bedrock: requires live AWS Bedrock access (skipped without credentials)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
